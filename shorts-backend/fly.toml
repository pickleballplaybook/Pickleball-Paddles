app = "shorts-backend"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  JOBS_DIR = "/data/jobs"
  OUTPUT_DIR = "/data/output"
  UPLOADS_DIR = "/data/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "performance-1x"
  memory = "2gb"

[[mounts]]
  source = "shorts_data"
  destination = "/data"
  initial_size = "10gb"
