[phases.setup]
# deno: yt-dlp uses it to solve YouTube's JS player challenges (without
# it, nsig extraction fails and downloads come back empty).
# We pull yt-dlp itself from its GitHub releases below instead of nixpkgs
# (which lags months behind YouTube's player changes).
nixPkgs = ["ffmpeg", "nodejs_20", "deno", "curl", "dejavu_fonts", "fontconfig"]

[phases.install]
cmds = [
  "npm ci",
  # `yt-dlp_linux` is the standalone Linux binary (PyInstaller-bundled, no
  # Python needed). The plain `yt-dlp` filename is a Python script and won't
  # run without python3 on PATH.
  #
  # Pull from the **nightly** builds repo, not stable. YouTube changes its
  # internal format manifests / signature challenges roughly weekly, and
  # stable lags master by ~1 week. Symptoms when stable goes stale: every
  # client attempt returns "Requested format is not available" or "Sign in
  # to confirm you're not a bot" even with valid cookies. Nightly tracks
  # master so the fix lands on the next deploy after a yt-dlp patch.
  "curl -L -o /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp_linux",
  "chmod +x /usr/local/bin/yt-dlp",
  "/usr/local/bin/yt-dlp --version"
]

[start]
cmd = "npm start"
