[phases.setup]
# deno: yt-dlp uses it to solve YouTube's JS player challenges (without
# it, nsig extraction fails and downloads come back empty).
# We pull yt-dlp itself from its GitHub releases below instead of nixpkgs
# (which lags months behind YouTube's player changes).
nixPkgs = ["ffmpeg", "nodejs_20", "deno", "curl"]

[phases.install]
cmds = [
  "npm ci",
  # `yt-dlp_linux` is the standalone Linux binary (PyInstaller-bundled, no
  # Python needed). The plain `yt-dlp` filename is a Python script and won't
  # run without python3 on PATH.
  "curl -L -o /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux",
  "chmod +x /usr/local/bin/yt-dlp",
  "/usr/local/bin/yt-dlp --version"
]

[start]
cmd = "npm start"
